global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
        - api:8080
        - graph-api:8081
        - ingester:8080
        - streamer:8080

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: neo4j
    static_configs:
      - targets: ["neo4j-exporter:7474"]

  - job_name: cassandra
    static_configs:
      - targets: ["cassandra-exporter:8080"]

  - job_name: spark
    metrics_path: /metrics/master
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
