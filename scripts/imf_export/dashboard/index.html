<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maroc — Tableau de Bord Macroéconomique</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#f0f2f5; color:#333; }
.header { background:linear-gradient(135deg,#003366,#005594); color:white; padding:30px 40px; }
.header h1 { font-size:28px; font-weight:700; }
.header p { opacity:.85; font-size:14px; margin-top:6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; padding:24px 40px; }
.card { background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); transition:transform .2s; }
.card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.12); }
.card h2 { font-size:14px; color:#666; margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
.card .value { font-size:32px; font-weight:700; color:#003366; }
.card .unit { font-size:14px; color:#999; }
.card .change { font-size:13px; margin-top:4px; }
.up { color:#006633; } .down { color:#C00000; }
.card-chart { grid-column:1/-1; }
.card-chart .chart-wrap { height:340px; }
.card-table { grid-column:1/-1; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#003366; color:white; padding:8px 12px; text-align:center; font-weight:600; }
td { padding:6px 12px; text-align:center; border-bottom:1px solid #e0e0e0; }
tr:nth-child(even) { background:#f8f9fa; }
tr:hover { background:#e8f0fe; }
td:first-child { text-align:left; font-weight:600; color:#003366; }
.footer { text-align:center; padding:20px; color:#999; font-size:12px; }
@media(max-width:768px) { .grid { padding:16px; gap:12px; } }
</style>
</head>
<body>

<div class="header">
  <h1>Indicateurs Macroeconomiques du Maroc</h1>
  <p>FMI World Economic Outlook (WEO) — 1980-2029 | Generation automatisee</p>
</div>

<div class="grid" id="kpiGrid"></div>
<div class="grid" id="chartsGrid"></div>
<div class="grid"><div class="card card-table" id="tableCard"></div></div>
<div class="footer">Source: IMF WEO Database — April 2026 | Donnees integrees: 17 indicateurs, 50 ans</div>

<script>
// ── Data from IMF_MOROCCO_VALUES ────────────────────────────────────
const DATA = {
  "NGDP_RPCH":  { "name": "Croissance du PIB", "unit": "%", "color": "#003366",
    "years": {1980:3.815,1981:-2.767,1982:6.855,1983:1.184,1984:4.449,1985:6.331,1986:8.525,1987:-2.493,1988:10.359,1989:1.757,1990:3.959,1991:6.943,1992:-3.988,1993:-0.989,1994:10.665,1995:-6.57,1996:11.966,1997:7.547,1998:7.71,1999:0.431,2000:1.586,2001:6.256,2002:3.059,2003:5.452,2004:4.158,2005:2.838,2006:5.382,2007:3.506,2008:5.647,2009:4.234,2010:3.579,2011:5.198,2012:3.003,2013:4.577,2014:2.658,2015:4.627,2016:0.354,2017:4.843,2018:3.078,2019:2.872,2020:-7.177,2021:8.065,2022:1.458,2023:3.359,2024:3.298,2025:3.899,2026:4,2027:4,2028:4,2029:3.9} },
  "NGDPDPC": { "name": "PIB par habitant", "unit": "USD", "color": "#FFC000",
    "years": {1980:1078.636,1990:1247.476,2000:1626.399,2010:3218.195,2020:3666.991,2021:4504.091,2022:4243.395,2023:4525.009,2024:4763.179,2025:5198.424,2026:5107.464,2027:5539.52,2028:5789.135,2029:6493.088} },
  "PCPIEPCH": { "name": "Inflation IPC", "unit": "%", "color": "#C00000",
    "years": {1980:9.361,1990:6.166,2000:1.905,2010:1.043,2020:0.724,2021:1.387,2022:6.644,2023:6.088,2024:1.161,2025:2.089,2026:2,2027:2,2028:2,2029:2} },
  "LUR": { "name": "Taux de chomage", "unit": "%", "color": "#ED7D31",
    "years": {1980:13.1,1990:14.85,2000:13.4,2010:9.1,2020:11.9,2021:12.3,2022:11.8,2023:12.4,2024:12.2,2025:12,2026:12.2,2027:12.2,2028:12.2,2029:12.2} },
  "GGXWDG": { "name": "Dette publique", "unit": "% PIB", "color": "#C00000",
    "years": {1990:76.663,2000:72.47,2010:48.197,2020:71.906,2021:70.465,2022:70.076,2023:69.573,2024:68.221,2025:67.14,2026:65.836,2027:64.59,2028:63.396,2029:62.3} },
  "GGXCNL": { "name": "Deficit budgetaire", "unit": "% PIB", "color": "#C00000",
    "years": {1990:-2.036,2000:-2.017,2010:-3.064,2020:-6.808,2021:-5.656,2022:-3.775,2023:-3.449,2024:-3.303,2025:-3.48,2026:-3.468,2027:-3.415,2028:-3.35,2029:-3.3} },
  "BCA_NGDPD": { "name": "Balance courante", "unit": "% PIB", "color": "#5B9BD5",
    "years": {1980:-7.633,1990:-1.249,2000:-2.726,2010:-4.057,2020:-0.592,2021:-1.606,2022:-2.991,2023:-2.116,2024:-2.723,2025:-3.005,2026:-3.239,2027:-3.413,2028:-3.517,2029:-4.29} },
  "NID_NGDP": { "name": "Investissement total", "unit": "% PIB", "color": "#FFC000",
    "years": {1980:25.453,1990:25.462,2000:25.189,2010:29.859,2020:28.615,2021:29.375,2022:29.724,2023:28.723,2024:29.053,2025:29.392,2026:29.792,2027:30.184,2028:30.567,2029:30} },
  "LP": { "name": "Population", "unit": "millions", "color": "#7030A0",
    "years": {1980:19.737,1990:22.921,2000:26.17,2010:28.96,2020:31.269,2021:31.456,2022:31.64,2023:31.825,2024:31.997,2025:32.165,2026:32.332,2027:32.499,2028:32.667,2029:32.835} },
};

// ── KPI Cards ──────────────────────────────────────────────────────
function buildKPIs() {
  const grid = document.getElementById('kpiGrid');
  const targets = [
    { code:'NGDP_RPCH', year:2026, label:'Croissance PIB 2026' },
    { code:'PCPIEPCH', year:2026, label:'Inflation 2026' },
    { code:'LUR', year:2026, label:'Chomage 2026' },
    { code:'GGXWDG', year:2026, label:'Dette/PIB 2026' },
    { code:'GGXCNL', year:2026, label:'Deficit 2026' },
    { code:'NGDPDPC', year:2026, label:'PIB/hab 2026' },
    { code:'BCA_NGDPD', year:2026, label:'Balance courante 2026' },
    { code:'LP', year:2026, label:'Population 2026' },
  ];
  targets.forEach(t => {
    const d = DATA[t.code];
    const v = d.years[t.year];
    const prev = d.years[t.year-1];
    const diff = prev ? ((v - prev) / Math.abs(prev) * 100).toFixed(1) : '';
    const trend = v > prev ? 'up' : 'down';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${t.label}</h2>
      <div class="value">${typeof v === 'number' ? v.toLocaleString('fr-FR',{maximumFractionDigits:1}) : v}</div>
      <div class="unit">${d.unit}</div>
      <div class="change ${trend}">${diff ? (trend === 'up' ? '▲' : '▼') + ' ' + diff + '% vs ' + (t.year-1) : ''}</div>`;
    grid.appendChild(card);
  });
}

// ── Charts ─────────────────────────────────────────────────────────
function buildCharts() {
  const grid = document.getElementById('chartsGrid');
  const chartKeys = ['NGDP_RPCH','PCPIEPCH','GGXWDG','BCA_NGDPD','NGDPDPC','LUR'];
  chartKeys.forEach(code => {
    const d = DATA[code];
    const entries = Object.entries(d.years).map(([k,v])=>[+k,v]).sort((a,b)=>a[0]-b[0]);
    const card = document.createElement('div');
    card.className = 'card card-chart';
    card.innerHTML = `<h2>${d.name} (${d.unit})</h2><div class="chart-wrap"><canvas id="chart-${code}"></canvas></div>`;
    grid.appendChild(card);

    setTimeout(() => {
      const ctx = document.getElementById(`chart-${code}`).getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: entries.map(e => e[0]),
          datasets: [{
            label: d.name,
            data: entries.map(e => e[1]),
            borderColor: d.color,
            backgroundColor: d.color + '33',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { maxTicksLimit: 15, font: { size: 10 } } },
            y: { beginAtZero: code === 'LUR' || code === 'LP', ticks: { font: { size: 10 } } }
          }
        }
      });
    }, 50);
  });
}

// ── Table ──────────────────────────────────────────────────────────
function buildTable() {
  const card = document.getElementById('tableCard');
  const years = [2020,2021,2022,2023,2024,2025,2026,2027,2028,2029];
  let html = '<h2>Tableau recapitulatif — Indicateurs cles</h2><table><thead><tr><th>Indicateur</th>';
  years.forEach(y => html += `<th>${y}</th>`);
  html += '</tr></thead><tbody>';
  const order = ['NGDP_RPCH','PCPIEPCH','LUR','GGXWDG','GGXCNL','NGDPDPC','BCA_NGDPD','NID_NGDP','LP'];
  order.forEach(code => {
    const d = DATA[code];
    html += `<tr><td>${d.name}</td>`;
    years.forEach(y => {
      const v = d.years[y];
      html += `<td>${v !== undefined ? (typeof v === 'number' ? v.toLocaleString('fr-FR',{maximumFractionDigits:2}) : v) : '-'}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  card.innerHTML = html;
}

buildKPIs();
buildCharts();
buildTable();
</script>
</body>
</html>
