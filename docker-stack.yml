version: "3.9"
name: rasd-maroc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7
    ports:
      - target: 27017
        published: 27017
    volumes:
      - mongodb_data:/data/db
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        published: 6379
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    ports:
      - target: 7474
        published: 7474
      - target: 7687
        published: 7687
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: cypher-shell -u neo4j -p password123 "RETURN 1"
      interval: 15s
      retries: 10
    logging: *default-logging

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    logging: *default-logging

  postgres-data:
    image: postgres:15-alpine
    command: >
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    environment:
      - POSTGRES_USER=rasd
      - POSTGRES_PASSWORD=rasd123
      - POSTGRES_DB=rasd_maroc_data
    volumes:
      - postgres_data_data:/var/lib/postgresql/data
      - ./scripts/debezium/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rasd", "-d", "rasd_maroc_data"]
      interval: 10s
      retries: 5
    logging: *default-logging

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - target: 9092
        published: 9092
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
      - KAFKA_CFG_BACKGROUND_THREADS=4
      - KAFKA_CFG_NUM_IO_THREADS=2
      - KAFKA_CFG_NUM_NETWORK_THREADS=2
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10
    logging: *default-logging

  cassandra:
    image: cassandra:4
    ports:
      - target: 9042
        published: 9042
    environment:
      - CASSANDRA_CLUSTER_NAME=RASD_Maroc
      - CASSANDRA_NUM_TOKENS=256
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "SELECT 1"]
      interval: 30s
      retries: 10
    logging: *default-logging

  api:
    image: ghcr.io/ysfmo98/rasd-maroc:latest
    ports:
      - target: 8080
        published: 8080
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rasd_maroc
      - REDIS_URL=redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - mongodb
      - redis
    logging: *default-logging

  graph-api:
    image: ghcr.io/ysfmo98/rasd-maroc:latest
    command: python scripts/graph_api.py
    ports:
      - target: 8081
        published: 8081
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rasd_maroc
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=password123
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    depends_on:
      - mongodb
      - neo4j
    logging: *default-logging

  ingester:
    image: ghcr.io/ysfmo98/rasd-maroc:latest
    command: python scripts/ingest_all.py --watch --interval 60
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rasd_maroc
    volumes:
      - ./data:/app/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    depends_on:
      - mongodb
    logging: *default-logging

  streamer:
    image: ghcr.io/ysfmo98/rasd-maroc:latest
    command: python scripts/streaming/kafka_producer.py
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rasd_maroc
      - KAFKA_BROKER=kafka:9092
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    depends_on:
      - mongodb
      - kafka
    logging: *default-logging

  cdc-consumer:
    image: ghcr.io/ysfmo98/rasd-maroc:latest
    command: python scripts/debezium/cdc_consumer.py
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/rasd_maroc
      - KAFKA_BROKER=kafka:9092
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    depends_on:
      - mongodb
      - kafka
      - kafka-connect
    logging: *default-logging

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6
    ports:
      - target: 8081
        published: 8087
    environment:
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    depends_on:
      - kafka
    logging: *default-logging

  kafka-connect:
    image: debezium/connect:2.7
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=rasd-connect
      - CONFIG_STORAGE_TOPIC=rasd_connect_configs
      - OFFSET_STORAGE_TOPIC=rasd_connect_offsets
      - STATUS_STORAGE_TOPIC=rasd_connect_status
      - KEY_CONVERTER=io.confluent.connect.avro.AvroConverter
      - VALUE_CONVERTER=io.confluent.connect.avro.AvroConverter
      - KEY_CONVERTER_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - VALUE_CONVERTER_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CONNECT_PLUGIN_PATH=/kafka/connect,/usr/share/java
      - KAFKA_HEAP_OPTS=-Xms512M -Xmx512M
      - CONNECT_TASKS_MAX=1
      - CONNECT_ERROR_TOLERANCE=all
      - CONNECT_ERRORS_DEADLETTERQUEUE_TOPIC_NAME=rasd-dlq
      - CONNECT_ERRORS_DEADLETTERQUEUE_CONTEXT_HEADERS_ENABLE=true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    depends_on:
      - kafka
      - schema-registry
      - postgres-data
    logging: *default-logging

  nextjs:
    image: ghcr.io/ysfmo98/rasd-maroc-frontend:latest
    ports:
      - target: 3000
        published: 3000
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:8081/graphql
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    depends_on:
      - api
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53
    ports:
      - target: 9090
        published: 9090
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1
    ports:
      - target: 3000
        published: 3001
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=rasd123
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    depends_on:
      - prometheus
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8
    ports:
      - target: 9100
        published: 9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49
    ports:
      - target: 8080
        published: 8086
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
    logging: *default-logging

volumes:
  mongodb_data:
  redis_data:
  neo4j_data:
  postgres_data:
  postgres_data_data:
  kafka_data:
  cassandra_data:
  prometheus_data:
  grafana_data:
